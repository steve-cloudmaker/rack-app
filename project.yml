name: Cedar
options:
  bundleIdPrefix: com.stevedaurora
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

targets:
  Cedar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Rack
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevedaurora.cedar
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        INFOPLIST_FILE: Rack/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rack/Cedar.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  Cedar:
    build:
      targets:
        Cedar: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
